<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Neural network brain illustration">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f4f9fb"/>
      <stop offset="100%" stop-color="#e8f2f6"/>
    </linearGradient>
    <linearGradient id="brainFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#b8d4e0"/>
      <stop offset="45%" stop-color="#94BDCE"/>
      <stop offset="100%" stop-color="#7aa8bc"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94BDCE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#94BDCE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#94BDCE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#94BDCE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94BDCE" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="nodeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bgGlow)" rx="32"/>

  <!-- Ambient glow -->
  <ellipse cx="320" cy="300" rx="210" ry="180" fill="#94BDCE" opacity="0.12" filter="url(#softBlur)"/>

  <!-- Outer network ring -->
  <g opacity="0.35" stroke="#94BDCE" stroke-width="1.2" fill="none">
    <circle cx="320" cy="300" r="230"/>
    <circle cx="320" cy="300" r="190" opacity="0.7"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#94BDCE" stroke-width="1.4" fill="none" opacity="0.45">
    <path d="M120 180 Q220 240 280 260"/>
    <path d="M520 180 Q420 240 360 260"/>
    <path d="M160 460 Q240 380 290 340"/>
    <path d="M480 460 Q400 380 350 340"/>
    <path d="M320 80 Q360 180 340 250"/>
    <path d="M320 80 Q280 180 300 250"/>
    <path d="M210 300 Q260 280 300 290"/>
    <path d="M430 300 Q380 280 340 290"/>
    <path d="M250 150 Q300 220 320 250"/>
    <path d="M390 150 Q340 220 320 250"/>
    <path d="M180 320 Q250 310 300 300"/>
    <path d="M460 320 Q390 310 340 300"/>
    <path d="M320 520 Q300 420 320 350"/>
    <path d="M220 400 Q280 360 310 330"/>
    <path d="M420 400 Q360 360 330 330"/>
  </g>

  <!-- Animated-style pulse lines -->
  <g stroke="url(#lineGlow)" stroke-width="2.2" fill="none" opacity="0.75">
    <path d="M250 150 Q300 220 320 250 Q340 280 360 320"/>
    <path d="M390 150 Q340 220 320 250 Q300 280 280 320"/>
    <path d="M120 180 Q220 240 280 260 Q310 285 320 300"/>
    <path d="M520 180 Q420 240 360 260 Q340 285 320 300"/>
  </g>

  <!-- Brain silhouette -->
  <g transform="translate(320 295)">
    <ellipse cx="0" cy="0" rx="118" ry="102" fill="#94BDCE" opacity="0.08" filter="url(#softBlur)"/>
    <path fill="url(#brainFill)" opacity="0.92" d="M0-92c-38-2-72 18-86 52-10 24-12 54-4 78 8 24 26 44 50 54 12 5 24 8 40 8s28-3 40-8c24-10 42-30 50-54 8-24 6-54-4-78-14-34-48-54-86-52z"/>
    <path fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9" d="M-44-18c-8 22-4 48 14 62M44-18c8 22 4 48-14 62"/>
    <path fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" d="M-24-6c-4 16 0 34 16 44M24-6c4 16 0 34-16 44"/>
    <path fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.8" d="M0-10v72"/>
    <path fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75" d="M-12 12c8 6 12 14 12 24M12 12c-8 6-12 14-12 24"/>
    <path fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.7" d="M-34 18c6 10 10 22 10 34M34 18c-6 10-10 22-10 34"/>
  </g>

  <!-- Network nodes -->
  <g>
    <circle cx="320" cy="300" r="16" fill="url(#nodeGlow)" filter="url(#nodeBlur)"/>
    <circle cx="320" cy="300" r="7" fill="#ffffff" stroke="#94BDCE" stroke-width="2"/>

    <circle cx="250" cy="150" r="10" fill="#ffffff" stroke="#94BDCE" stroke-width="2" opacity="0.95"/>
    <circle cx="390" cy="150" r="10" fill="#ffffff" stroke="#94BDCE" stroke-width="2" opacity="0.95"/>
    <circle cx="120" cy="180" r="8" fill="#ffffff" stroke="#94BDCE" stroke-width="1.8" opacity="0.9"/>
    <circle cx="520" cy="180" r="8" fill="#ffffff" stroke="#94BDCE" stroke-width="1.8" opacity="0.9"/>
    <circle cx="180" cy="320" r="7" fill="#ffffff" stroke="#94BDCE" stroke-width="1.6" opacity="0.85"/>
    <circle cx="460" cy="320" r="7" fill="#ffffff" stroke="#94BDCE" stroke-width="1.6" opacity="0.85"/>
    <circle cx="160" cy="460" r="8" fill="#ffffff" stroke="#94BDCE" stroke-width="1.8" opacity="0.9"/>
    <circle cx="480" cy="460" r="8" fill="#ffffff" stroke="#94BDCE" stroke-width="1.8" opacity="0.9"/>
    <circle cx="320" cy="80" r="9" fill="#ffffff" stroke="#94BDCE" stroke-width="1.8" opacity="0.92"/>
    <circle cx="320" cy="520" r="8" fill="#ffffff" stroke="#94BDCE" stroke-width="1.8" opacity="0.88"/>
    <circle cx="220" cy="400" r="6" fill="#ffffff" stroke="#94BDCE" stroke-width="1.5" opacity="0.8"/>
    <circle cx="420" cy="400" r="6" fill="#ffffff" stroke="#94BDCE" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Subtle labels -->
  <g font-family="'Open Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#5f8fa3" letter-spacing="1.2">
    <text x="320" y="585" text-anchor="middle">NEURAL CONNECTIVITY</text>
  </g>
</svg>
